name = "tel-ai-bot"
main = "src/worker.js"
compatibility_date = "2026-09-23"

# Workers AI — به‌صورت خودکار توسط Deploy Button ساخته و بایند می‌شود
[ai]
binding = "AI"

# KV namespace برای ذخیره‌ی تاریخچه‌ی مکالمه و مدل انتخابی هر کاربر
# عمداً بدون "id" — کلادفلر خودش هنگام دیپلوی می‌سازد و اینجا می‌نویسد
[[kv_namespaces]]
binding = "CHAT_HISTORY"

# نکته: TAVILY_API_KEY ،CF_API_TOKEN ،CF_ACCOUNT_ID و ALLOWED_USER_IDS
# عمداً اینجا تعریف نشده‌اند تا در صفحه‌ی نصب Deploy Button ظاهر نشوند.
# همه‌ی این‌ها اختیاری‌اند و کد فقط در صورت وجودشان استفاده می‌کند؛
# هر وقت خواستی، بعد از نصب از پنل کلادفلر دستی اضافه‌شان کن
# (Workers & Pages → نام ورکر → Settings → Variables and Secrets).
