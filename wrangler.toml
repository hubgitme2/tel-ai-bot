name = "ai-multitask-bot"
main = "src/worker.js"
compatibility_date = "2026-09-23"

# Workers AI — به‌صورت خودکار توسط Deploy Button ساخته و بایند می‌شود
[ai]
binding = "AI"

# KV namespace برای ذخیره‌ی تاریخچه‌ی مکالمه و مدل انتخابی هر کاربر
# عمداً بدون "id" — کلادفلر خودش هنگام دیپلوی می‌سازد و اینجا می‌نویسد
[[kv_namespaces]]
binding = "CHAT_HISTORY"

# متغیرهای عمومی و اختیاری (سکرت نیستند، در صفحه‌ی تنظیمات Deploy Button قابل ویرایش‌اند)
[vars]
# اگر خالی بماند، ربات برای همه باز است. برای محدود کردن، آی‌دی عددی
# کاربران مجاز را با کاما جدا کن، مثل: 111111111,222222222
ALLOWED_USER_IDS = ""
# اختیاری — فقط برای نمایش وضعیت مصرف Neuron در /start و /model لازم است
CF_ACCOUNT_ID = ""
